<text x="118.1" y="58.0" font-size="2.3" font-weight="700" fill="#333">This is the actual routed board:</text>
<text x="118.1" y="61.6" font-size="2.3" font-weight="400" fill="#333">* 0 unconnected, 0 vias, 0 shorts.</text>
<text x="118.1" y="65.2" font-size="2.3" font-weight="400" fill="#333">* 8 top-side jumper wires (F.Cu) -</text>
<text x="118.1" y="68.8" font-size="2.3" font-weight="400" fill="#333">   see buck_v2_top_cu.dxf.</text>
<text x="118.1" y="72.4" font-size="2.3" font-weight="400" fill="#333">* L1 (35 mm toroid) gets its own</text>
<text x="118.1" y="76.0" font-size="2.3" font-weight="400" fill="#333">   quadrant; power switch Q1/D3 to</text>
<text x="118.1" y="79.6" font-size="2.3" font-weight="400" fill="#333">   its right; 555 control up top.</text>
<text x="118.1" y="83.2" font-size="2.3" font-weight="400" fill="#333"></text>
<text x="118.1" y="86.8" font-size="2.3" font-weight="700" fill="#333">To build:</text>
<text x="118.1" y="90.4" font-size="2.3" font-weight="400" fill="#333">* Etch buck_v2.dxf (MIRROR).</text>
<text x="118.1" y="94.0" font-size="2.3" font-weight="400" fill="#333">* Drill buck_v2_holes.dxf (89).</text>
<text x="118.1" y="97.6" font-size="2.3" font-weight="400" fill="#333">* Solder the 8 jumpers on top.</text>
<text x="118.1" y="101.2" font-size="2.3" font-weight="400" fill="#333"></text>
<text x="118.1" y="104.8" font-size="2.3" font-weight="400" fill="#c0392b">Open: no V1 input terminal -</text>
<text x="118.1" y="108.4" font-size="2.3" font-weight="400" fill="#333">wire V1 to C1 / Q1 drain, or add</text>
<text x="118.1" y="112.0" font-size="2.3" font-weight="400" fill="#333">a 2-pin terminal there.</text>
