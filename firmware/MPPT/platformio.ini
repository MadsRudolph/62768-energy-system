[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_unflags = -std=gnu++11

build_flags =
    -std=gnu99

; default env = the MPPT firmware; keep the bench test out of it
build_src_filter = +<*> -<test_resistor.c>

upload_protocol = arduino
upload_speed = 115200
monitor_speed = 9600

[env:test]
platform = atmelavr
board = nanoatmega328
framework = arduino

build_unflags = -std=gnu++11

build_flags =
    -std=gnu99

; bench resistor test = test_resistor.c instead of main.c
build_src_filter = +<*> -<main.c>

upload_protocol = arduino
upload_speed = 115200
monitor_speed = 9600
