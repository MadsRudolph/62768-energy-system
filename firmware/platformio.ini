; ============================================================
;  PlatformIO - 62768 Electrical Energy Systems firmware
;  Bygger til Arduino Uno (ATmega328P) og Mega 2560.
;
;    pio run -e uno            byg til Uno
;    pio run -e mega           byg til Mega 2560
;    pio run -e uno -t upload  upload til board
;    pio device monitor        seriel overvågning (115200 baud)
; ============================================================
[platformio]
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:uno]
board = uno

[env:mega]
board = megaatmega2560
