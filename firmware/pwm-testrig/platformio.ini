; ============================================================
;  PWM-testrig - Arduino Nano (ATmega328P), bare-metal AVR C
;
;  To potmetre saetter PWM-frekvens og duty cycle paa D9,
;  vaerdierne vises paa en SSD1306 OLED (I2C).
;
;    pio run                      byg (klon-Nano, gammel bootloader)
;    pio run -t upload            flash via USB
;    pio run -e nano_new -t upload  original Nano (ny bootloader)
; ============================================================
[platformio]
default_envs = nano_old

[env]
platform = atmelavr
board_build.f_cpu = 16000000L
build_flags = -Wall -Os

; Klon-Nano med CH340: gammel bootloader (57600 baud) - langt det mest almindelige
[env:nano_old]
board = nanoatmega328

; Original Nano / ny Optiboot bootloader (115200 baud)
[env:nano_new]
board = nanoatmega328new
